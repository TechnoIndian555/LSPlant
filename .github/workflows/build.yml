
name: Build Test APK

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build Test APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
      - name: List projects
        run: |
          echo "=== Available projects ==="
          ./gradlew projects --no-daemon
          
      - name: Build LSPlant library first
        run: |
          echo "Building LSPlant library..."
          ./gradlew :lsplant:assembleRelease
          
      - name: Build Test APK
        run: |
          echo "Building test module APK..."
          ./gradlew :test:assembleRelease
          
      - name: Show all outputs
        run: |
          echo "=== All generated files ==="
          echo ""
          echo "LSPlant AAR:"
          find lsplant/build -name "*.aar" -type f 2>/dev/null | while read file; do
            echo "  - $(basename "$file") ($(ls -lh "$file" | awk '{print $5}'))"
          done || echo "  No AAR found"
          
          echo ""
          echo "Test APK:"
          find test/build/outputs -name "*.apk" -type f 2>/dev/null | while read file; do
            echo "  - $(basename "$file") ($(ls -lh "$file" | awk '{print $5}'))"
          done || echo "  No APK found"
          
      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: test-release-apk
          path: |
            test/build/outputs/apk/release/
            lsplant/build/outputs/aar/
          if-no-files-found: error
