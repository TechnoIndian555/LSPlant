
name: Build LSPlant Linux

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    name: Build LSPlant Library
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          
      - name: Install required NDK
        run: |
          echo "Installing NDK 25.2.9519653..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          
      - name: Build ARM libraries
        run: |
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          
          # ARM64 build
          echo "Building ARM64 library..."
          ./gradlew :lsplant:assembleArm64-v8aRelease
          
          # ARM7 build  
          echo "Building ARM7 library..."
          ./gradlew :lsplant:assembleArmeabi-v7aRelease
          
      - name: Show built files
        run: |
          echo "=== Built Libraries ==="
          
          echo "ARM64 files:"
          find lsplant/build -path "*arm64-v8aRelease*" -name "*.so" -type f 2>/dev/null | while read file; do
            echo "  - $(basename "$file") ($(ls -lh "$file" | awk '{print $5}'))"
          done || echo "  No ARM64 files"
          
          echo ""
          echo "ARM7 files:"
          find lsplant/build -path "*armeabi-v7aRelease*" -name "*.so" -type f 2>/dev/null | while read file; do
            echo "  - $(basename "$file") ($(ls -lh "$file" | awk '{print $5}'))"
          done || echo "  No ARM7 files"
          
          echo ""
          echo "AAR files:"
          find lsplant/build -name "*.aar" -type f 2>/dev/null | while read file; do
            echo "  - $(basename "$file") ($(ls -lh "$file" | awk '{print $5}'))"
          done || echo "  No AAR files"
          
      - name: Upload ARM64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: arm64-libs
          path: |
            lsplant/build/intermediates/cmake/arm64-v8aRelease/obj/
            lsplant/build/intermediates/stripped_native_libs/arm64-v8aRelease/out/lib/
          if-no-files-found: warn
          
      - name: Upload ARM7 libraries
        uses: actions/upload-artifact@v4
        with:
          name: arm7-libs
          path: |
            lsplant/build/intermediates/cmake/armeabi-v7aRelease/obj/
            lsplant/build/intermediates/stripped_native_libs/armeabi-v7aRelease/out/lib/
          if-no-files-found: warn
          
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: lsplant-aar
          path: lsplant/build/outputs/aar/
          if-no-files-found: ignore
          
      - name: Upload complete build directory
        uses: actions/upload-artifact@v4
        with:
          name: build-directory
          path: lsplant/build/
          retention-days: 7
