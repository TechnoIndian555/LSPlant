
name: Build APK Only

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - name: Setup Java with cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          
      - name: Setup Android SDK and accept licenses
        uses: android-actions/setup-android@v3
        
      - name: Accept NDK license
        run: |
          echo "Accepting NDK license..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13599879" --licenses || true
          
      - name: Accept all Android licenses
        run: |
          echo "Accepting all Android licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
      - name: List available projects
        run: |
          echo "=== Listing all Gradle projects ==="
          ./gradlew projects --no-daemon
          
      - name: List available tasks
        run: |
          echo "=== Listing all assemble tasks ==="
          ./gradlew tasks --all | grep -i assemble || true
          
      - name: Check project structure
        run: |
          echo "=== Project structure ==="
          find . -name "build.gradle" -o -name "build.gradle.kts" | sort
          echo ""
          echo "=== Settings.gradle content ==="
          cat settings.gradle 2>/dev/null || cat settings.gradle.kts 2>/dev/null || echo "No settings file found"
          
      - name: Try building APK
        run: |
          echo "Trying to build APK..."
          
          # Pehle lsplant build karein
          ./gradlew :lsplant:assembleRelease --no-daemon || echo "lsplant:assembleRelease failed"
          
          # Ab dekhte hain kya kya build hua
          echo ""
          echo "=== All built files ==="
          find . -name "*.apk" -o -name "*.aar" -type f 2>/dev/null || echo "No APK/AAR files found"
          
      - name: Upload any built files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-artifacts
          path: |
            **/*.apk
            **/*.aar
          if-no-files-found: warn
