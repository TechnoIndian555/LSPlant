
name: Build APK Only

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - name: Setup Java with cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          
      - name: List available projects
        run: |
          echo "=== Listing all Gradle projects ==="
          ./gradlew projects
          
      - name: List available tasks
        run: |
          echo "=== Listing all assemble tasks ==="
          ./gradlew tasks --all | grep assemble || true
          
      - name: Check project structure
        run: |
          echo "=== Project structure ==="
          find . -name "build.gradle" -o -name "build.gradle.kts" | sort
          echo ""
          echo "=== Settings.gradle ==="
          cat settings.gradle 2>/dev/null || cat settings.gradle.kts 2>/dev/null || echo "No settings file found"
          
      - name: Build APK (try lsplant)
        run: |
          echo "Trying to build lsplant APK..."
          ./gradlew :lsplant:assembleRelease
          
      - name: Find APKs
        run: |
          echo "=== Looking for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          
      - name: Upload any APK found
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-files
          path: |
            **/*.apk
          if-no-files-found: warn
