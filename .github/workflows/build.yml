
name: Build ARM Release Libraries

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-arm-release:
    name: Build ARM64 & ARM7 Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
      - name: Clean previous builds
        run: |
          rm -rf lsplant/build
          
      - name: Build ARM64 Release
        run: |
          echo "Building ARM64 Release library..."
          ./gradlew :lsplant:assembleArm64-v8aRelease
          
      - name: Build ARM7 Release
        run: |
          echo "Building ARM7 Release library..."
          ./gradlew :lsplant:assembleArmeabi-v7aRelease
          
      - name: Show build outputs
        run: |
          echo "=== Release Build Outputs ==="
          echo ""
          echo "ARM64 Release files:"
          find lsplant/build -path "*arm64-v8aRelease*" -name "*.so" -type f 2>/dev/null | while read file; do
            echo "  - $(basename "$file") ($(ls -lh "$file" | awk '{print $5}'))"
          done || echo "  No ARM64 files found"
          
          echo ""
          echo "ARM7 Release files:"
          find lsplant/build -path "*armeabi-v7aRelease*" -name "*.so" -type f 2>/dev/null | while read file; do
            echo "  - $(basename "$file") ($(ls -lh "$file" | awk '{print $5}'))"
          done || echo "  No ARM7 files found"
          
          echo ""
          echo "AAR files:"
          find lsplant/build -name "*.aar" -type f 2>/dev/null | while read file; do
            echo "  - $(basename "$file") ($(ls -lh "$file" | awk '{print $5}'))"
          done || echo "  No AAR files found"
          
      - name: Upload ARM64 Release libraries
        uses: actions/upload-artifact@v4
        with:
          name: arm64-release
          path: |
            lsplant/build/intermediates/cmake/arm64-v8aRelease/obj/
            lsplant/build/intermediates/stripped_native_libs/arm64-v8aRelease/out/lib/
          if-no-files-found: warn
          
      - name: Upload ARM7 Release libraries
        uses: actions/upload-artifact@v4
        with:
          name: arm7-release
          path: |
            lsplant/build/intermediates/cmake/armeabi-v7aRelease/obj/
            lsplant/build/intermediates/stripped_native_libs/armeabi-v7aRelease/out/lib/
          if-no-files-found: warn
          
      - name: Upload Release AAR
        uses: actions/upload-artifact@v4
        with:
          name: release-aar
          path: lsplant/build/outputs/aar/
          if-no-files-found: ignore
