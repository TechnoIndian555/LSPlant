name: Build APK Only

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
          
      - name: Build APK
        run: |
          echo "Building APK..."
          ./gradlew :test:assembleRelease
          
      - name: Show APK info
        run: |
          echo "=== APK File ==="
          ls -lh test/build/outputs/apk/release/*.apk 2>/dev/null || echo "APK not found!"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: test/build/outputs/apk/release/
